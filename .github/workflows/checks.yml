name: Windows checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:security
      - run: npm test
      - run: npm run test:preferences
      - run: npm run test:smoke
      - run: npm run build -- --publish never
      - run: ./scripts/test-package.ps1 -Install
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-reports-and-installer
          path: |
            artifacts/*.json
            dist/TikDesk-Setup-*.exe
          retention-days: 7
